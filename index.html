<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>爱心弹窗</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {background:#000;overflow:hidden;height:100vh;}
        .popup {
            position: absolute;
            width: 150px;
            height: 60px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:"Microsoft YaHei",sans-serif;
            font-size:14px;
            border-radius:6px;
            padding:4px;
            text-align:center;
            z-index:999;
        }
    </style>
</head>
<body>
<script>
const tips = ["学业有成", "好好爱自己", "好好吃饭", "保持好心情",
    "身体健康", "顺顺利利", "别熬夜", "天凉了多穿衣服"];
const colors = ["pink", "lightblue", "lightgreen", "lemonchiffon",
    "hotpink", "skyblue"];

// 爱心数学公式，生成n个点
function heartPoints(n, screenW, screenH) {
    const points = [];
    for(let i=0;i<n;i++){
        const t = i / n * 2 * Math.PI;
        const x = 16 * Math.pow(Math.sin(t),3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        let sx = Math.floor(screenW/2 + x*20 -50);
        let sy = Math.floor(screenH/2 - y*20 -80);
        sx = Math.max(0, Math.min(sx, screenW -150));
        sy = Math.max(0, Math.min(sy, screenH -60));
        points.push([sx,sy]);
    }
    return points;
}

// 创建弹窗DOM
function createPopup(x,y,tip=null){
    const div = document.createElement("div");
    div.className = "popup";
    div.style.left = x+"px";
    div.style.top = y+"px";
    const text = tip ?? tips[Math.floor(Math.random()*tips.length)];
    div.innerText = text;
    div.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
    // 空格关闭当前弹窗
    document.addEventListener("keydown",(e)=>{
        if(e.code === "Space") div.remove();
    })
    document.body.appendChild(div);
    return div;
}

// 延时工具
function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

(async function main(){
    const sw = window.innerWidth;
    const sh = window.innerHeight;
    const hearts = [];

    // ==========阶段1：爱心绽放==========
    const points = heartPoints(100, sw, sh);
    for(let i=0;i<points.length;i++){
        const [x,y] = points[i];
        const tip = i === points.length-1 ? "充实自己" : null;
        const win = createPopup(x,y,tip);
        hearts.push(win);
        await sleep(30);
    }

    await sleep(1000);
    hearts.forEach(w=>w.remove());

    // ==========阶段2：满屏暴击==========
    const count = Math.floor((sw/150)*(sh/40)) + 50;
    const allWins = [];
    for(let _=0;_<count;_++){
        const x = Math.floor(Math.random()*(sw-150));
        const y = Math.floor(Math.random()*(sh-60));
        const win = createPopup(x,y);
        allWins.push(win);
        await sleep(5);
    }

    await sleep(10000);

    // ==========阶段3：优雅逐个关闭==========
    const interval = 1000 / allWins.length;
    for(let win of allWins){
        win.remove();
        await sleep(interval);
    }
})();
</script>
</body>
</html>
